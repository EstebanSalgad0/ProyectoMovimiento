name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servidor/requirements*.txt
      - name: Librerías del sistema para MediaPipe/OpenCV
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test test_capturas
      - run: flutter analyze
      - run: flutter test
