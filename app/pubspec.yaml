name: medicina_app
description: "Proyecto Movimiento: análisis de movimiento con IA para Android e iOS."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Cámara y detección de pose en el dispositivo (tiempo real)
  camera: ^0.12.1
  google_mlkit_pose_detection: ^0.16.1
  google_mlkit_commons: ^0.13.0
  wakelock_plus: ^1.8.1
  flutter_tts: ^4.2.5

  # Video (selección, grabación y vista previa)
  image_picker: ^1.2.3
  video_player: ^2.14.1

  # Red y persistencia
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  crypto: ^3.0.6

  # UI
  fl_chart: ^1.2.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/especificacion/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fuentes/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fuentes/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fuentes/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fuentes/PlusJakartaSans-ExtraBold.ttf
          weight: 800
